    </g>
  </g>
<g class="headgear" data-hide="hair" opacity="1" stroke-width="3.5"><g class="mushroom-cap"><path fill="#b66153" d="M65 154Q86 58 185 47Q284 39 335 154Q200 190 65 154Z"/><ellipse cx="200" cy="155" rx="135" ry="24" fill="#ebd9b6"/><path d="M100 157L156 165M139 149L177 165M200 145V168M261 149L223 165M300 157L244 165" stroke="#b99e82" stroke-width="2"/><g fill="#f0e4ca" stroke="none"><ellipse cx="125" cy="112" rx="22" ry="15" transform="rotate(-25 125 112)"/><ellipse cx="205" cy="78" rx="26" ry="17"/><ellipse cx="283" cy="118" rx="21" ry="16"/></g></g><g class="magic-dust" fill="#d6bc7a" stroke="none"><circle cx="75" cy="193" r="5"/><circle cx="320" cy="207" r="4"/><circle cx="304" cy="186" r="3"/></g></g></g>
</g></svg>