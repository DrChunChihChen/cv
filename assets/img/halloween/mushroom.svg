<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-labelledby="mushroom-title">
<title id="mushroom-title">Your portrait in the 蘑菇精靈 Mushroom outfit</title>
<g class="character" stroke="#22211f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
