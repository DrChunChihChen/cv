    <!-- Face -->
    <path id="mushroom-face" class="face" d="M120 157 Q124 110 200 109 Q276 110 280 157
      L274 256 Q272 286 252 306 L226 329 Q201 345 176 331
      L148 307 Q127 287 125 260 Z"/>

    <!-- Hair: one solid silhouette -->
    <path id="mushroom-hair" class="hair" opacity="0" fill="#111" stroke-width="2" d="
      M117 208 Q105 164 118 127 L116 113 L127 122
      L132 91 L142 103 L151 68 L162 82 L174 42
      Q197 46 216 65 L212 48 Q250 62 269 94
      L272 77 Q288 105 287 125 L293 116 Q302 156 285 207
      L278 183 L265 133 Q249 122 231 119 L237 126
      Q213 121 194 125 Q143 119 130 153 Z"/>

    <!-- Brows -->
    <g id="mushroom-brows" class="brows" fill="none" stroke-width="6">
      <path d="M140 187 Q157 179 177 184"/>
      <path d="M222 182 Q243 175 260 183"/>
    </g>

    <!-- Glasses -->
    <g id="mushroom-glasses" class="glasses" fill="none" stroke-width="3.5">
      <path d="M130 204 Q133 196 157 196 Q180 195 186 204
        Q190 220 181 237 Q173 244 148 241 Q131 240 130 204 Z"/>
      <path d="M213 203 Q218 193 243 193 Q267 192 270 202
        Q271 227 261 236 Q247 243 227 237 Q215 234 213 203 Z"/>
      <path d="M187 207 Q200 201 213 206 M120 202 L130 204
               M270 200 L281 200"/>
    </g>

    <!-- Eyes -->
    <g id="mushroom-eyes" class="eyes">
      <path d="M144 212 Q157 201 171 211 M229 208 Q243 197 256 208"
            fill="none" stroke-width="3"/>
      <g fill="#111" stroke="none">
        <ellipse cx="159" cy="215" rx="4.5" ry="7"/>
        <ellipse cx="241" cy="211" rx="4.5" ry="7"/>
      </g>
    </g>

    <!-- Nose and smile -->
    <g fill="none">
      <path id="mushroom-nose" class="nose" d="M195 233 L188 255 Q187 260 208 257"/>
      <path id="mushroom-mouth" class="mouth" d="M176 282 Q201 287 225 276"/>
      <path d="M169 275 Q165 278 165 282 M232 271 Q237 274 237 279"
