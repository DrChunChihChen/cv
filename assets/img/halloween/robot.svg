<path class="neck-skin" fill="#f4eee2" d="M174 314 Q170 337 155 359 Q200 387 245 359 Q230 337 226 314 Z"/>
<g clip-path="url(#robot-neck-clip)"><path class="neck-shadow" fill="#272724" fill-opacity=".12" stroke="none" d="M174 327 Q200 342 226 327 L231 346 Q200 360 169 346 Z"/></g><path fill="#9aaeb1" d="M155 351 Q137 356 105 367 Q64 380 57 425 L49 487 Q200 506 351 487 L343 425 Q336 380 295 367 Q263 356 245 351 Q200 376 155 351 Z"/><defs><clipPath id="robot-body-clip"><path d="M155 351 Q137 356 105 367 Q64 380 57 425 L49 487 Q200 506 351 487 L343 425 Q336 380 295 367 Q263 356 245 351 Q200 376 155 351 Z"/></clipPath></defs><g clip-path="url(#robot-body-clip)"><path fill="#697f85" d="M155 351Q200 375 245 351L249 378H151Z"/><rect x="125" y="397" width="150" height="85" rx="13" fill="#c9cebc"/><rect x="140" y="410" width="75" height="37" rx="4" fill="#536e70"/><path d="M148 435L159 435L167 420L178 440L188 425L204 425" stroke="#cbe0ae" fill="none"/><circle cx="242" cy="420" r="8" fill="#c7855c"/><circle cx="242" cy="445" r="8" fill="#cfb877"/><path d="M145 463H211M79 416L108 423M76 433L105 440M321 416L292 423M324 433L295 440" stroke="#556f75" fill="none" stroke-width="5"/></g></g>
<g class="head">  <g stroke="#111" stroke-width="4" stroke-linecap="round"
