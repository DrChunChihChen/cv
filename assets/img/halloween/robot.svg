    </g>
  </g>
<g class="headgear" data-hide="hair" opacity="1" stroke-width="3.5"><path d="M200 73V38" stroke="#677b7f" stroke-width="6"/><circle cx="200" cy="31" r="12" fill="#d49265"/><path fill="#a5b6b7" d="M105 183V104Q105 76 135 76H265Q295 76 295 104V183L275 174V150H125V174Z"/><path fill="#d1d5c5" d="M132 92H268V129H132Z"/><path d="M151 103V118M175 103V118M199 103V118M223 103V118M247 103V118" stroke="#6c8589"/><rect x="88" y="183" width="32" height="66" rx="8" fill="#a5b6b7"/><rect x="280" y="183" width="32" height="66" rx="8" fill="#a5b6b7"/><circle cx="104" cy="215" r="6" fill="#d9bd7f"/><circle cx="296" cy="215" r="6" fill="#d9bd7f"/></g></g>
</g></svg>