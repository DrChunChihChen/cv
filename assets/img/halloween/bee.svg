  </g>
<g class="headgear" data-hide="" opacity="1" stroke-width="3.5"><path d="M132 123Q200 100 268 123" stroke="#d7b770" stroke-width="12" fill="none"/><g class="bee-antennae"><path d="M145 113Q112 78 126 53M255 113Q288 78 274 53" stroke="#3f3a37" stroke-width="5" fill="none"/><circle cx="127" cy="48" r="13" fill="#d7b770"/><circle cx="273" cy="48" r="13" fill="#d7b770"/></g><ellipse cx="143" cy="259" rx="13" ry="6" fill="#d9a383" stroke="none"/><ellipse cx="257" cy="257" rx="13" ry="6" fill="#d9a383" stroke="none"/></g></g>
</g></svg>