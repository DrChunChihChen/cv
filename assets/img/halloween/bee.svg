    <!-- Eyes -->
    <g id="bee-eyes" class="eyes">
      <path d="M144 212 Q157 201 171 211 M229 208 Q243 197 256 208"
            fill="none" stroke-width="3"/>
      <g fill="#111" stroke="none">
        <ellipse cx="159" cy="215" rx="4.5" ry="7"/>
        <ellipse cx="241" cy="211" rx="4.5" ry="7"/>
      </g>
    </g>

    <!-- Nose and smile -->
    <g fill="none">
      <path id="bee-nose" class="nose" d="M195 233 L188 255 Q187 260 208 257"/>
      <path id="bee-mouth" class="mouth" d="M176 282 Q201 287 225 276"/>
