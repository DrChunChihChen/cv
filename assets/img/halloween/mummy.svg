      <path d="M222 182 Q243 175 260 183"/>
    </g>

    <!-- Glasses -->
    <g id="mummy-glasses" class="glasses" fill="none" stroke-width="3.5">
      <path d="M130 204 Q133 196 157 196 Q180 195 186 204
        Q190 220 181 237 Q173 244 148 241 Q131 240 130 204 Z"/>
      <path d="M213 203 Q218 193 243 193 Q267 192 270 202
