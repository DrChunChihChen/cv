      <g fill="#111" stroke="none">
        <ellipse cx="159" cy="215" rx="4.5" ry="7"/>
        <ellipse cx="241" cy="211" rx="4.5" ry="7"/>
      </g>
    </g>

    <!-- Nose and smile -->
    <g fill="none">
      <path id="pirate-nose" class="nose" d="M195 233 L188 255 Q187 260 208 257"/>
