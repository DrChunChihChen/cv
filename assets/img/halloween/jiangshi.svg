<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-labelledby="jiangshi-title">
<title id="jiangshi-title">Your portrait in the 殭屍道長 Jiangshi outfit</title>
