<path class="neck-skin" fill="#f4eee2" d="M174 314 Q170 337 155 359 Q200 387 245 359 Q230 337 226 314 Z"/>
<g clip-path="url(#jiangshi-neck-clip)"><path class="neck-shadow" fill="#272724" fill-opacity=".12" stroke="none" d="M174 327 Q200 342 226 327 L231 346 Q200 360 169 346 Z"/></g><path fill="#43556d" d="M155 351 Q137 356 105 367 Q64 380 57 425 L49 487 Q200 506 351 487 L343 425 Q336 380 295 367 Q263 356 245 351 Q200 376 155 351 Z"/><defs><clipPath id="jiangshi-body-clip"><path d="M155 351 Q137 356 105 367 Q64 380 57 425 L49 487 Q200 506 351 487 L343 425 Q336 380 295 367 Q263 356 245 351 Q200 376 155 351 Z"/></clipPath></defs><g clip-path="url(#jiangshi-body-clip)"><path fill="#e2d1a8" d="M155 351L200 380L245 351L252 363L204 398L148 365Z"/><path d="M204 393V495" stroke="#bb9966" stroke-width="5"/><g stroke="#dac49b" stroke-width="4"><path d="M186 413H222M186 439H222M186 465H222"/></g><circle cx="204" cy="412" r="5" fill="#c9a868"/><circle cx="204" cy="438" r="5" fill="#c9a868"/><circle cx="204" cy="464" r="5" fill="#c9a868"/><path d="M69 452L115 462M331 452L285 462" stroke="#b99b6c" stroke-width="12"/></g></g>
<g class="head">  <g stroke="#111" stroke-width="4" stroke-linecap="round"
