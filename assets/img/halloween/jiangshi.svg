  </g>
<g class="headgear" data-hide="hair" opacity="1" stroke-width="3.5"><path fill="#3c4e68" d="M108 157L112 119Q119 66 200 66Q281 66 288 119L292 157Z"/><path d="M200 76V139M143 91L136 138M257 91L264 138" stroke="#6e7b8e" fill="none"/><ellipse cx="200" cy="66" rx="13" ry="10" fill="#984f4b"/><path fill="#242e43" d="M100 144Q200 126 300 144V171Q200 152 100 171Z"/><circle cx="200" cy="149" r="12" fill="#c4ab71"/><g class="talisman"><path fill="#e4c77f" d="M184 158H216L219 251L201 246L183 254Z"/><path d="M192 172H209M200 165V192M190 183H211M192 195L209 203L192 213L209 221M200 219V237M191 230H210" stroke="#a35143" stroke-width="3" fill="none"/></g></g></g>
</g></svg>